[package]
name = "engine"
description = "no_std core for tiny-infer: model config, weight layout, arena allocator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
libm = "0.2.16"
# no_std PRNG for the sampler. `default-features = false` drops std / OS entropy so
# the engine stays no_std; the host supplies the seed.
rand = { version = "0.10.1", default-features = false }
