[package]
name = "engine"
description = "no_std core for tiny-infer: model config, weight layout, arena allocator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[dependencies]
libm = "0.2.16"

[features]
default = ["seq2seq"]
# The Marian-style encoder-decoder (translation) path. Disable for a leaner
# decoder-only build: `default-features = false` compiles just the Llama path.
seq2seq = []
