[package]
name = "engine"
description = "no_std shared core for tiny-infer: arena allocator, compute/quant kernels, sampler"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "engine"
path = "src/lib.rs"

[features]
# Real-FFT magnitude spectrum (`dsp` module). Off by default so the decoder model
# crates (`llama`, `seq2seq`) pull in no FFT dependency; `edge-pm`'s feature extractor
# enables it.
fft = ["dep:microfft"]

[dependencies]
libm = "0.2.16"
# Real FFT for the optional `dsp` module (no_std, alloc-free, fixed 512-point). Only the
# size we use is compiled in; std is off, keeping the engine no_std.
microfft = { version = "0.6", default-features = false, features = ["size-512"], optional = true }
# no_std PRNG for the sampler. `default-features = false` drops std / OS entropy so
# the engine stays no_std; the host supplies the seed.
rand = { version = "0.10.1", default-features = false }
# Portable SIMD on stable Rust: `f32x8` / `i32x8` for the vectorized matmul kernels,
# replacing `core::simd` (which would need the nightly `portable_simd` feature).
# `default-features = false` drops wide's `std` feature so the engine stays no_std (we use
# only arithmetic/reductions, no transcendentals); SIMD acceleration is cfg-gated, not
# feature-gated, so it is unaffected.
wide = { version = "1.5", default-features = false }
