[package]
name = "llama"
description = "no_std decoder-only Llama-2 inference, built on the tiny-infer engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "llama"
path = "src/lib.rs"

[dependencies]
# The shared inference core (Arena, math/quant kernels, sampler).
engine = { path = "../engine" }
# Transcendental fns `core` lacks (used directly by the forward pass).
libm = "0.2.16"
